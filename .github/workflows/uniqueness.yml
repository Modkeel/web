name: uniqueness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every indexable page has its own text
        run: python scripts/uniqueness.py
      - name: _redirects covers every page
        run: python scripts/redirects.py --check
